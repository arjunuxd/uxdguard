
      - name: Diagnose Go formatting
        shell: bash
        run: |
          echo "Runner OS: $RUNNER_OS"
          go version
          which go
          which gofmt
          echo "Checked commit:"
          git rev-parse HEAD
          echo "Working tree:"
          git status --short
          echo "Go files reported by gofmt:"
          gofmt -l .

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These Go files need formatting:"
            printf '%s\n' "$files"
            exit 1
          fi
          echo "All Go files are formatted."
